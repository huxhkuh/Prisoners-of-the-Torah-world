
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .page { padding: 1.5rem 0; }
  .header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .header h1 { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.4rem; }
  .header p { font-size: 14px; color: var(--color-text-secondary); }
  .section-title { font-size: 16px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1rem; }
  .detainee-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 2rem; }
  .detainee-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; cursor: pointer; transition: border-color 0.15s; }
  .detainee-card:hover { border-color: var(--color-border-primary); }
  .detainee-card.selected { border: 1.5px solid #1D9E75; }
  .detainee-name { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .detainee-meta { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; }
  .bank-info { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 8px 10px; font-size: 12px; }
  .bank-info .label { color: var(--color-text-secondary); margin-bottom: 2px; }
  .bank-info .value { font-weight: 500; color: var(--color-text-primary); font-size: 13px; }
  .donation-badge { display: inline-flex; align-items: center; gap: 4px; background: #E1F5EE; color: #0F6E56; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: var(--border-radius-md); margin-top: 8px; }
  .form-panel { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 2rem; }
  .form-row { margin-bottom: 1rem; }
  .form-label { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; display: block; }
  input[type="text"], input[type="number"], textarea, select { width: 100%; font-family: var(--font-sans); }
  textarea { resize: vertical; min-height: 90px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .submit-btn { background: #1D9E75; color: white; border: none; border-radius: var(--border-radius-md); padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; width: 100%; }
  .submit-btn:hover { opacity: 0.88; }
  .submit-btn:active { opacity: 0.75; }
  .messages-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 2rem; }
  .message-item { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; }
  .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .msg-sender { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
  .msg-target { font-size: 11px; background: #E6F1FB; color: #185FA5; padding: 2px 8px; border-radius: var(--border-radius-md); }
  .msg-date { font-size: 11px; color: var(--color-text-secondary); }
  .msg-text { font-size: 14px; color: var(--color-text-primary); line-height: 1.6; }
  .msg-donation { font-size: 11px; color: #0F6E56; margin-top: 4px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; border-bottom: 0.5px solid var(--color-border-tertiary); padding-bottom: 0; }
  .tab { padding: 8px 16px; font-size: 14px; cursor: pointer; color: var(--color-text-secondary); border-bottom: 2px solid transparent; margin-bottom: -0.5px; transition: color 0.15s; }
  .tab.active { color: var(--color-text-primary); border-bottom-color: #1D9E75; font-weight: 500; }
  .empty-state { text-align: center; padding: 2rem; color: var(--color-text-secondary); font-size: 14px; }
  .success-msg { background: #E1F5EE; color: #0F6E56; border-radius: var(--border-radius-md); padding: 10px 14px; font-size: 13px; margin-bottom: 1rem; display: none; }
  .copy-btn { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 12px; font-size: 12px; cursor: pointer; color: var(--color-text-primary); }
  .copy-btn:hover { background: var(--color-background-tertiary); }
  .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 2rem; }
  .stat-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .stat-label { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .selected-indicator { font-size: 13px; color: #1D9E75; margin-bottom: 1rem; font-weight: 500; }
</style>

<div class="page" dir="rtl">
  <h2 class="sr-only" style="position:absolute;left:-9999px">אתר תמיכה בעצורי מצפון לומדי תורה</h2>

  <div class="header">
    <h1>חיזוק ותמיכה לעצורים</h1>
    <p>שלחו מסר חיזוק אישי ועדכנו תרומה לעצורים</p>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-box"><div class="stat-num" id="statDetainees">3</div><div class="stat-label">עצורים</div></div>
    <div class="stat-box"><div class="stat-num" id="statMessages">0</div><div class="stat-label">הודעות חיזוק</div></div>
    <div class="stat-box"><div class="stat-num" id="statDonations">₪0</div><div class="stat-label">סה"כ תרומות</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('support')">שלח חיזוק</div>
    <div class="tab" onclick="showTab('messages')">הודעות שנשלחו</div>
  </div>

  <div id="tab-support">
    <p class="section-title">בחר עצור לחיזוק</p>
    <div class="detainee-grid" id="detaineeGrid"></div>

    <div class="form-panel">
      <div id="selectedIndicator" class="selected-indicator" style="display:none"></div>
      <div id="successMsg" class="success-msg">✓ ההודעה נשמרה בהצלחה! תשלח לעצור בקרוב.</div>

      <div class="form-grid">
        <div class="form-row">
          <label class="form-label">שמך (לשליחה)</label>
          <input type="text" id="senderName" placeholder="ישראל ישראלי" />
        </div>
        <div class="form-row">
          <label class="form-label">סכום תרומה (₪) — אופציונלי</label>
          <input type="number" id="donationAmount" placeholder="0" min="0" />
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">מסר חיזוק אישי</label>
        <textarea id="messageText" placeholder="כתוב כאן מילות חיזוק, עידוד, פסוק, ברכה... הכל יגיע אליו"></textarea>
      </div>

      <button class="submit-btn" onclick="submitMessage()">שלח חיזוק ←</button>
    </div>
  </div>

  <div id="tab-messages" style="display:none">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
      <p class="section-title" style="margin:0">כל ההודעות שנשלחו</p>
      <button class="copy-btn" onclick="copyAllMessages()"><i class="ti ti-copy" aria-hidden="true"></i> העתק הכל</button>
    </div>
    <div class="messages-list" id="messagesList">
      <div class="empty-state">עדיין לא נשלחו הודעות חיזוק</div>
    </div>
  </div>
</div>

<script>
const detainees = [
  { id: 1, name: "משה כהן", age: "22", yeshiva: "ישיבת מיר", bank: "הבנק הבינלאומי", account: "12-345-678901", branch: "123" },
  { id: 2, name: "אברהם לוי", age: "21", yeshiva: "ישיבת פוניבז'", bank: "בנק הפועלים", account: "23-456-789012", branch: "456" },
  { id: 3, name: "יצחק גולדברג", age: "23", yeshiva: "ישיבת קלם", bank: "בנק לאומי", account: "34-567-890123", branch: "789" },
];

let selectedId = null;
let messages = [];

function renderDetainees() {
  const grid = document.getElementById('detaineeGrid');
  grid.innerHTML = detainees.map(d => `
    <div class="detainee-card ${selectedId === d.id ? 'selected' : ''}" onclick="selectDetainee(${d.id})">
      <div class="detainee-name">${d.name}</div>
      <div class="detainee-meta">גיל ${d.age} · ${d.yeshiva}</div>
      <div class="bank-info">
        <div class="label">פרטי חשבון לתרומה</div>
        <div class="value">${d.bank}</div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px">חשבון: ${d.account} | סניף: ${d.branch}</div>
      </div>
      ${getDonationBadge(d.id)}
    </div>
  `).join('');
}

function getDonationBadge(id) {
  const total = messages.filter(m => m.detaineeId === id && m.donation > 0).reduce((s, m) => s + m.donation, 0);
  return total > 0 ? `<div class="donation-badge"><i class="ti ti-heart" aria-hidden="true" style="font-size:12px"></i> ₪${total.toLocaleString()} נתרמו</div>` : '';
}

function selectDetainee(id) {
  selectedId = id;
  renderDetainees();
  const d = detainees.find(x => x.id === id);
  const ind = document.getElementById('selectedIndicator');
  ind.textContent = `נבחר: ${d.name}`;
  ind.style.display = 'block';
}

function submitMessage() {
  if (!selectedId) { alert('נא לבחור עצור תחילה'); return; }
  const sender = document.getElementById('senderName').value.trim();
  const text = document.getElementById('messageText').value.trim();
  const donation = parseFloat(document.getElementById('donationAmount').value) || 0;
  if (!text) { alert('נא לכתוב מסר חיזוק'); return; }

  const d = detainees.find(x => x.id === selectedId);
  messages.push({
    detaineeId: selectedId,
    detaineeName: d.name,
    sender: sender || 'אנונימי',
    text,
    donation,
    date: new Date().toLocaleDateString('he-IL')
  });

  document.getElementById('senderName').value = '';
  document.getElementById('messageText').value = '';
  document.getElementById('donationAmount').value = '';
  const sm = document.getElementById('successMsg');
  sm.style.display = 'block';
  setTimeout(() => sm.style.display = 'none', 3000);

  updateStats();
  renderMessages();
  renderDetainees();
}

function updateStats() {
  document.getElementById('statMessages').textContent = messages.length;
  const total = messages.reduce((s, m) => s + m.donation, 0);
  document.getElementById('statDonations').textContent = '₪' + total.toLocaleString();
}

function renderMessages() {
  const list = document.getElementById('messagesList');
  if (!messages.length) {
    list.innerHTML = '<div class="empty-state">עדיין לא נשלחו הודעות חיזוק</div>';
    return;
  }
  list.innerHTML = [...messages].reverse().map(m => `
    <div class="message-item">
      <div class="msg-header">
        <span class="msg-sender">${m.sender}</span>
        <span class="msg-target">ל${m.detaineeName}</span>
        <span class="msg-date">${m.date}</span>
      </div>
      <div class="msg-text">${m.text}</div>
      ${m.donation > 0 ? `<div class="msg-donation"><i class="ti ti-coin" aria-hidden="true" style="font-size:12px"></i> תרומה: ₪${m.donation.toLocaleString()}</div>` : ''}
    </div>
  `).join('');
}

function copyAllMessages() {
  if (!messages.length) { alert('אין הודעות להעתקה'); return; }
  const text = messages.map(m =>
    `--- ${m.detaineeName} | מ: ${m.sender} | ${m.date} ---\n${m.text}${m.donation > 0 ? `\nתרומה: ₪${m.donation}` : ''}`
  ).join('\n\n');
  navigator.clipboard.writeText(text).then(() => alert('הועתק ✓'));
}

function showTab(tab) {
  document.getElementById('tab-support').style.display = tab === 'support' ? 'block' : 'none';
  document.getElementById('tab-messages').style.display = tab === 'messages' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'support') || (i === 1 && tab === 'messages'));
  });
}

renderDetainees();
</script>
